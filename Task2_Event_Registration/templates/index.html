<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeAlpha Event Registration</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <section class="hero">
      <p class="eyebrow">CODEALPHA BACKEND TASK 2</p>
      <h1>Event Registration System</h1>
      <p>Create events and let users register through a simple API-powered interface.</p>
    </section>

    <section class="card">
      <h2>Create Event</h2>
      <form id="eventForm" class="grid-form">
        <input name="title" placeholder="Event title" required>
        <input name="location" placeholder="Location" required>
        <input name="event_date" type="datetime-local" required>
        <input name="capacity" type="number" min="1" placeholder="Capacity" required>
        <textarea name="description" placeholder="Event description" required></textarea>
        <button type="submit">Create Event</button>
      </form>
      <p id="eventMessage"></p>
    </section>

    <section>
      <h2>Available Events</h2>
      <div id="events" class="events">Loading...</div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
